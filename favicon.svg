<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="64" height="64">
  <rect width="100" height="100" rx="24" fill="#1C1C1C"/>
  
  {/* Outer Diamond-Arch Frame */}
  <rect x="12" y="12" width="76" height="76" rx="38" stroke="#B08D67" stroke-width="3" stroke-opacity="0.9"/>
  <rect x="20" y="20" width="60" height="60" rx="30" stroke="#B08D67" stroke-width="1.5" stroke-dasharray="3 3" stroke-opacity="0.5"/>

  {/* Hijab Arch Flow Silhouette */}
